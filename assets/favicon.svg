<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="10" y1="16" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Donkere afgeronde achtergrond met driekleurige rand (Emerald, Indigo, Amber) -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="3.5"/>

  <!-- Subtiele glans bovenin -->
  <path d="M17.5 4.25H46.5C53.5 4.25 59.25 10 59.25 17V20C46 25 18 25 4.75 20V17C4.75 10 10.5 4.25 17.5 4.25Z" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Monogram PW -->
  <text x="30" y="41" text-anchor="middle" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" letter-spacing="-1">PW</text>

  <!-- Gouden/Emerald status- & creatie-spark rechtsboven -->
  <circle cx="50.5" cy="14.5" r="4" fill="#10b981"/>
  <circle cx="50.5" cy="14.5" r="6.5" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>
</svg>
